[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geond-agent-protocol"
version = "0.1.1"
description = "Shared context and coordination protocol for heterogeneous AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "geond-agent-protocol contributors" }]
dependencies = [
    "anyio>=4.14.2",
    "azure-identity>=1.17.0",
    "mcp>=2.0.0",
    "openai>=3.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.0.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.14.3",
    "trio>=0.34.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[project.scripts]
geond = "geond.cli:main"
geond-mcp = "geond.mcp_server.server:main"
geond-orchestrator = "geond_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["repo", "docs/patent"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["repo", "docs", ".venv", "node_modules", "build", "dist"]

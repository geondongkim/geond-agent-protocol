[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geond-agent-protocol"
version = "0.1.0-alpha.0"
description = "Shared memory and code graph protocol for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "geond-agent-protocol contributors" }]
dependencies = [
    "azure-identity>=1.17.0",
    "mcp>=1.9.0",
    "openai>=1.40.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.8.0",
    "trio>=0.25.0",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pre-commit>=4.0.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
geond = "geond.cli:main"
geond-mcp = "geond.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

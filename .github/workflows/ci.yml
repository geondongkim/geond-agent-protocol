name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: geond
          POSTGRES_PASSWORD: geond_dev_password
          POSTGRES_USER: geond
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U geond -d geond"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GEOND_DATABASE_URL: postgresql://geond:geond_dev_password@localhost:55432/geond
      # CI must not set GEOND_PRIVACY_MODE globally: provider tests assert their own
      # privacy mode, and a broad local-only override changes unit-test semantics.
      GEOND_EMBEDDING_PROVIDER: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Compile Python sources
        run: uv run python -m compileall src scripts

      - name: Check documentation links
        run: uv run python scripts/check_docs_links.py

      - name: Generate release notes preview
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            uv run python scripts/generate_release_notes.py \
              --since-previous-tag \
              --until "${GITHUB_REF_NAME}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --limit 20 \
              --output release-notes-draft.md
          else
            uv run python scripts/generate_release_notes.py \
              --limit 20 \
              --output release-notes-draft.md
          fi

      - name: Upload release notes preview
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-draft
          path: release-notes-draft.md
          if-no-files-found: error

      - name: Run tests
        run: uv run pytest

      - name: Run benchmark smoke
        run: |
          uv run geond seed-sample
          uv run geond benchmark-search \
            --mode keyword \
            --repeat 3 \
            --limit 5 \
            --workspace-uri "file:///sample/geond" \
            --save \
            --label ci-smoke \
            --format markdown \
            --include-results \
            "service.py database initialization" > benchmark-smoke.md
          uv run geond benchmark-report \
            --workspace-uri "file:///sample/geond" \
            --mode keyword \
            --format markdown > benchmark-report.md

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v7
        with:
          name: geond-ci-benchmark
          path: |
            benchmark-smoke.md
            benchmark-report.md
          if-no-files-found: error

      - name: Build package
        run: uv build

      - name: Generate package checksums
        run: uv run python scripts/write_dist_checksums.py

      - name: Upload package dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-dist
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Generate tag release notes
        run: |
          python scripts/generate_release_notes.py \
            --since-previous-tag \
            --until "${GITHUB_REF_NAME}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --output release-notes-draft.md

      - name: Build package artifacts
        run: uv build

      - name: Generate package checksums
        run: uv run python scripts/write_dist_checksums.py

      - name: Sign release artifacts
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS.txt
          upload-signing-artifacts: true
          release-signing-artifacts: false

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes-draft.md
          files: |
            release-notes-draft.md
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS.txt
            dist/*.sigstore.json

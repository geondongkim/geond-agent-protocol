name: Feature request
description: Suggest a focused improvement for Geond.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent workflow or reviewer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP
        - CLI
        - Importers
        - Dashboard
        - Reservations
        - Handoffs
        - Code graph
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workaround or adjacent tool are you using now?
  - type: checkboxes
    id: boundary
    attributes:
      label: Boundary checks
      options:
        - label: This request does not assume Geond is an agent runner.
          required: true
        - label: This request does not require private transcripts or secrets to be shared publicly.
          required: true

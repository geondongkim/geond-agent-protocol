name: Bug report
description: Report a reproducible Geond bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Geond. Do not include private transcripts,
        secrets, `.env` values, access tokens, database passwords, or unredacted
        dashboard screenshots.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands, config shape, or workflow steps.
      placeholder: |
        1. Run `uv run geond doctor --format text`
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, database profile, MCP client, and Geond commit or version.
      placeholder: Windows 11, Python 3.11, local PostgreSQL, VS Code MCP, commit ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only redacted logs or screenshots. Remove secrets and private transcript text.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets, tokens, passwords, private transcripts, and local-only evidence.
          required: true
        - label: I understand Geond is alpha and strongest today for repository-centered workflows.
          required: true

name: Documentation issue
description: Report unclear, stale, or missing documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: page
    attributes:
      label: Page or section
      description: Link the README/docs section or describe where you expected guidance.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or example
      description: Optional, but concrete commands or screenshots help.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not include private transcripts, secrets, or local-only evidence.
          required: true
